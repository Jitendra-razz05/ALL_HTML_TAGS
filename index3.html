<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index 3 Forms </title>
</head>
<body>
        <!-- Input and label tags -->
        <form action="#">
            <label for="UserName">UserName :
                <input type="text" id="UserName" placeholder="Enter the Name" value="Rahull" required>
            </label><br>
            <label for="Passworld">Passworld :
                <input type="password" id="password" placeholder="Enter the Passworld" value="sd@477Q" required>
            </label><br>
            <button class="submit">Submit</button>
            <hr>
            <!-- Date tags -->
            <label for="Date">Date :
                    <input type="date" id="Date" >
            </label>
            <hr> 
            <!-- File open tags -->
            <label for="File Choose"> File Choose
                <input type="file" >
            </label>
            <hr>
            <!-- colors tags -->
            <label for="Colors">Colors :
                <input type="color">
            </label>
            <hr>
            <!-- Range tags -->
            <label for="Range"> price Range :
                <input type="range">
            </label>
            <hr>
            <!-- Normal Button tags -->
            <label for="Button"> Button :
             <button class="clink here">clink here</button>
             </label>
             <hr>
             <!-- Radio Button tags -->
             <label for="Male">Male
                <input type="radio" id="Male" name="gender" value="Male">
             </label><br>
             <label for="Female">Female
                <input type="radio" id="Female" name="gender" value="Female">
             </label><br>
             <label for="Other">Other
                <input type="radio" id="Other" name="gender" value="Other">
             </label>
             <hr>
             <!-- checkbox Button tags -->
             <label for="HTML">HTML
                <input type="checkbox" id="HTML" name="Lang" value="HTML">
             </label><br>
             <label for="CSS">CSS
                <input type="checkbox" id="CSS" name="Lang" value="CSS">
             </label><br>
             <label for="JS">JS
                <input type="checkbox" id="JS" name="Lang" value="JS">
             </label><hr>
             <!-- Selection bar tags -->
              <label for="County">Choose the County</label>
              <select name="County" id="County">
                <option value="select">Select the County</option>
                <option value="India">India</option>
                <option value="USE">USE</option>
                <option value="UK">UK</option>
                <option value="NZ">NZ</option>
              </select><hr>
              <!-- textarea tags -->
                 <textarea name="Address" id="Address" rows="5" cols="40">
                 please fill the address
              </textarea>
              <hr>

               <!-- Search bar -->
               <label for="Search">Search
                <input type="search" placeholder="Search">
               </label>
               <hr>

               <!-- url tags -->
               <label for="URL">URL :
                <input type="url">
               </label>

                <hr>
               <!-- Email tags -->
                <label for="Email">Email Id :
                    <input type="email" placeholder="email">
                </label>

                <hr>
                <!-- Number tags -->
                <label for="Phone">Phone no:
                    <input type="number" placeholder="Phone number">
                </label>
                  <hr>

                  <!-- month tags -->
                <label for="Month">Month
                    <input type="month">
                </label>
                <hr>
                
        </form>
  
</body>
</html>
